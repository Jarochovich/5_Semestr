<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
</head>
<body>
    <div id="fio"></div>

     <script >  
    // jQuery.ajax('http://localhost:5000/api/name')
    //     .responseText();

    $.ajax({
        method: 'GET',
        url: 'http://localhost:5000/api/name',
        success: (data) => {$('#fio').text(`${data.surname} ${data.name} ${data.patronymic}`)}
    });
    
    </script> 
</body>
</html>
